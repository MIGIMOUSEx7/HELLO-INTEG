{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seller Center | Messages</title>
    <link rel="stylesheet" href="{% static 'css/shop.css' %}">
    <link rel="stylesheet" href="{% static 'css/chat.css' %}">
    <style>
        .message-container { 
            display: flex; 
            height: calc(100vh - 120px); 
            margin: 20px; 
            border: 1px solid #ddd; 
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
        }
        .customer-list { 
            width: 300px; 
            min-width: 300px; 
            border-right: 1px solid #ddd; 
            overflow-y: auto; 
            background: #fafafa; 
        }
        .chat-area { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: #fff; 
        }
        .customer-item { 
            padding: 15px; 
            border-bottom: 1px solid #eee; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        .customer-item:hover { background: #f0f0f0; }
        .customer-item.active { 
            border-left: 5px solid #ee4d2d; 
            background: #fff5f2; 
        }
        #chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f9f9f9;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-main">
            <div class="logo">Seller Center</div>
            <a href="{% url 'home' %}" style="color: white; text-decoration: none;">Back to Shop</a>
        </div>
    </nav>

    <div class="container">
        <div class="message-container">
            <div class="customer-list">
                <h3 style="padding:15px; border-bottom: 1px solid #eee;">Conversations</h3>
                {% for customer in customers %}
                <div class="customer-item" onclick="loadCustomerChat('{{ customer.sender }}', '{{ customer.sender__username }}', this)">
                    <strong>{{ customer.sender__username }}</strong><br>
                    <small style="color:#888;">Store: {{ customer.store__store_name }}</small>
                </div>
                {% empty %}
                <p style="padding:15px; color: #888;">No messages yet.</p>
                {% endfor %}
            </div>

            <div class="chat-area">
                <div id="seller-chat-header" style="padding:15px; background:#fff; border-bottom:1px solid #eee; font-weight:bold;">
                    Select a customer to start chatting
                </div>
                <div id="chat-messages"></div>
                <div class="chat-input-area" id="input-container" style="display:none; padding: 15px; border-top: 1px solid #eee;">
                    <input type="text" id="chat-input" placeholder="Reply to customer..." onkeypress="if(event.key==='Enter') sendReply()">
                    <button class="chat-send-btn" onclick="sendReply()">Reply</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedCustomerId = null;
        let sellerStoreId = "{{ stores.first.id }}";

        async function loadCustomerChat(customerId, username, element) {
            selectedCustomerId = customerId;
            
            if (element) {
                document.querySelectorAll('.customer-item').forEach(item => item.classList.remove('active'));
                element.classList.add('active');
            }

            document.getElementById('seller-chat-header').innerText = "Chatting with: " + username;
            document.getElementById('input-container').style.display = 'flex';
            
            const res = await fetch(`/api/messages/?sender=${customerId}`);
            const data = await res.json();
            const container = document.getElementById('chat-messages');
            
            container.innerHTML = data.map(m => `
                <div class="msg ${m.sender == "{{ user.id }}" ? 'sent' : 'received'}">
                    ${m.message}
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        async function sendReply() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !selectedCustomerId) return;

            const res = await fetch('/api/messages/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    store: parseInt(sellerStoreId),
                    message: text,
                    receiver: parseInt(selectedCustomerId)
                })
            });

            if (res.ok) {
                input.value = '';
                const currentName = document.getElementById('seller-chat-header').innerText.replace("Chatting with: ", "");
                loadCustomerChat(selectedCustomerId, currentName);
            }
        }

        setInterval(() => {
            if (selectedCustomerId) {
                const currentName = document.getElementById('seller-chat-header').innerText.replace("Chatting with: ", "");
                loadCustomerChat(selectedCustomerId, currentName);
            }
        }, 5000);
    </script>
</body>
</html>
