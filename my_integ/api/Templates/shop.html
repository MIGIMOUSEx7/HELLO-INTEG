<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tindahan - Ang Iyong Merkado</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c0392b;
            --primary-dark: #8b1e0f;
            --primary-light: #e05a3a;
            --accent: #e8a838;
            --accent-warm: #f0c060;
            --bg: #f5ede0;
            --card-bg: #fdf6ec;
            --text-main: #3b2a1a;
            --text-secondary: #6b4c30;
            --text-light: #8a6a50;
            --border-color: #d9c4a8;
            --success: #2e7d32;
            --warning: #e65100;
            --shadow-sm: 2px 2px 0px #d9c4a8;
            --shadow-md: 4px 4px 0px #d9c4a8;
            --shadow-lg: 8px 8px 0px #d9c4a8;
        }

        [data-theme="dark"] {
            --bg: #1a1008;
            --card-bg: #261808;
            --text-main: #f0dfc0;
            --text-secondary: #c8a880;
            --text-light: #b09070;
            --border-color: #4a3020;
            --shadow-sm: 2px 2px 0px #4a3020;
            --shadow-md: 4px 4px 0px #4a3020;
            --shadow-lg: 8px 8px 0px #4a3020;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Lato', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            transition: background 0.3s ease;
        }

        /* Noise texture */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 150px;
        }

        .bg-pattern {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-pattern::before {
            content: '';
            position: absolute;
            top: -200px; right: -200px;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-warm) 0%, transparent 70%);
            opacity: 0.2;
            animation: drift 20s infinite ease-in-out;
        }

        .bg-pattern::after {
            content: '';
            position: absolute;
            bottom: -150px; left: -100px;
            width: 500px; height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            opacity: 0.08;
            animation: drift 26s infinite ease-in-out reverse;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -40px) scale(1.1); }
        }

        /* Border strips */
        .border-strip-top {
            height: 6px;
            background: repeating-linear-gradient(
                90deg,
                var(--primary) 0px, var(--primary) 20px,
                var(--accent) 20px, var(--accent) 40px,
                var(--primary-light) 40px, var(--primary-light) 60px,
                var(--accent-warm) 60px, var(--accent-warm) 80px
            );
            position: relative;
            z-index: 1001;
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(135deg, #2c1008 0%, #4a1e0a 50%, #3a1508 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
            position: sticky;
            top: 0;
            z-index: 1000;
            animation: slideDown 0.6s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .navbar-top {
            padding: 8px 5%;
            background: rgba(0,0,0,0.2);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            font-size: 12px;
            border-bottom: 1px solid rgba(240, 192, 96, 0.15);
        }

        .navbar-top a {
            color: var(--accent-warm);
            text-decoration: none;
            opacity: 0.85;
            transition: all 0.3s;
            padding: 4px 10px;
            border-radius: 3px;
            letter-spacing: 0.5px;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
        }

        .navbar-top a:hover {
            opacity: 1;
            background: rgba(240, 192, 96, 0.15);
        }

        .navbar-top .user-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: rgba(240, 192, 96, 0.12);
            border: 1px solid rgba(240, 192, 96, 0.25);
            border-radius: 3px;
            color: var(--accent-warm);
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .navbar-main {
            padding: 14px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo-wrap {
            display: flex;
            flex-direction: column;
            cursor: pointer;
            animation: fadeInLeft 0.8s ease;
            transition: transform 0.3s;
        }

        .logo-wrap:hover { transform: scale(1.04); }

        .logo {
            color: var(--accent-warm);
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.4);
        }

        .logo-tagline {
            color: var(--accent);
            font-size: 9px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .search-bar {
            flex: 1;
            max-width: 560px;
            margin: 0 32px;
            position: relative;
            animation: fadeInUp 0.8s ease;
        }

        .search-input {
            width: 100%;
            padding: 12px 56px 12px 18px;
            border: 2px solid transparent;
            border-radius: 3px;
            font-size: 14px;
            font-family: 'Lato', sans-serif;
            outline: none;
            background: #fdf6ec;
            color: var(--text-main);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.25);
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 6px 6px 0px rgba(0,0,0,0.3);
            transform: translate(-2px, -2px);
        }

        .search-input::placeholder { color: #b09070; }

        .search-btn {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            height: calc(100% - 8px);
            padding: 0 16px;
            background: var(--primary);
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.3s;
            font-size: 15px;
            font-weight: 700;
        }

        .search-btn:hover {
            background: var(--primary-light);
            transform: translateY(-50%) translateY(-1px);
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeInRight 0.8s ease;
        }

        .theme-toggle-nav {
            background: rgba(240, 192, 96, 0.15);
            border: 1px solid rgba(240, 192, 96, 0.3);
            color: var(--accent-warm);
            padding: 8px 14px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .theme-toggle-nav:hover {
            background: rgba(240, 192, 96, 0.25);
            transform: translateY(-1px);
        }

        .cart-link {
            position: relative;
            color: var(--accent-warm);
            text-decoration: none;
            font-size: 24px;
            padding: 10px 16px;
            border-radius: 3px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(240, 192, 96, 0.12);
            border: 1px solid rgba(240, 192, 96, 0.25);
        }

        .cart-link:hover {
            background: rgba(240, 192, 96, 0.22);
            transform: translateY(-2px);
            box-shadow: 3px 3px 0px rgba(0,0,0,0.2);
        }

        .cart-badge {
            position: absolute;
            top: 4px; right: 6px;
            background: var(--primary);
            color: white;
            border-radius: 2px;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            text-align: center;
            font-family: 'Lato', sans-serif;
        }

        /* Layout */
        .container {
            max-width: 1400px;
            margin: 32px auto;
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 28px;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* Sidebar */
        .sidebar-card {
            background: var(--card-bg);
            padding: 22px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            transition: all 0.3s;
            animation: fadeInLeft 1s ease;
        }

        .sidebar-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translate(-2px, -2px);
        }

        .sidebar-card h4 {
            margin: 0 0 18px 0;
            font-family: 'Playfair Display', serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
        }

        .sidebar-card h4 .h4-accent {
            display: inline-block;
            width: 4px;
            height: 18px;
            background: var(--primary);
            border-radius: 1px;
            flex-shrink: 0;
        }

        .list-item {
            padding: 10px 12px;
            font-size: 13px;
            color: var(--text-secondary);
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            border: 1px solid transparent;
            border-left: 3px solid transparent;
        }

        .list-item:hover {
            background: rgba(192, 57, 43, 0.06);
            color: var(--primary);
            border-left-color: var(--primary);
            padding-left: 16px;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
            animation: fadeInUp 1s ease;
        }

        .card {
            background: var(--card-bg);
            border-radius: 4px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
            cursor: pointer;
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        .card:hover {
            transform: translate(-4px, -4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }

        .card-image {
            height: 220px;
            background: linear-gradient(135deg, #ede0cc 0%, #e0cdb0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            font-size: 48px;
            position: relative;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-image img {
            transform: scale(1.08);
        }

        .card-body { padding: 16px; }

        .product-name {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            line-height: 1.4;
            height: 44px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-bottom: 4px;
            color: var(--text-main);
            font-weight: 700;
        }

        .product-description {
            font-size: 12px;
            line-height: 1.5;
            height: 36px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-bottom: 12px;
            color: var(--text-light);
            font-weight: 300;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--border-color);
        }

        .price {
            color: var(--primary);
            font-size: 20px;
            font-weight: 800;
            font-family: 'Playfair Display', serif;
        }

        .stock-badge {
            font-size: 10px;
            padding: 4px 9px;
            border-radius: 2px;
            background: rgba(46, 125, 50, 0.1);
            color: var(--success);
            font-weight: 700;
            border: 1px solid rgba(46, 125, 50, 0.25);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .stock-badge.out {
            background: rgba(192, 57, 43, 0.08);
            color: var(--primary);
            border-color: rgba(192, 57, 43, 0.25);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .cart-btn, .order-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            font-family: 'Lato', sans-serif;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .cart-btn {
            background: var(--card-bg);
            color: var(--primary);
            border: 2px solid var(--primary);
            border-bottom: 3px solid var(--primary-dark);
        }

        .cart-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .cart-btn:active { transform: translateY(1px); border-bottom-width: 1px; }

        .order-btn {
            background: var(--primary);
            color: white;
            border: 2px solid transparent;
            border-bottom: 3px solid var(--primary-dark);
        }

        .order-btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .order-btn:active { transform: translateY(1px); border-bottom-width: 1px; }

        .cart-btn:disabled, .order-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* Sold Out Overlay */
        .sold-out-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 220px;
            background: rgba(253, 246, 236, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            color: var(--primary);
            font-size: 22px;
            z-index: 10;
            letter-spacing: 4px;
            text-transform: uppercase;
            border-bottom: 2px dashed var(--border-color);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: var(--card-bg);
            padding: 16px 24px;
            border-radius: 4px;
            box-shadow: var(--shadow-lg);
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 4000;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--success);
            font-family: 'Lato', sans-serif;
            font-size: 14px;
            color: var(--text-main);
            animation: toastIn 0.4s ease;
        }

        .toast.error { border-left-color: var(--primary); }

        @keyframes toastIn {
            from { transform: translateX(300px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Footer strip */
        .footer-strip {
            height: 6px;
            background: repeating-linear-gradient(
                90deg,
                var(--accent-warm) 0px, var(--accent-warm) 20px,
                var(--primary-light) 20px, var(--primary-light) 40px,
                var(--accent) 40px, var(--accent) 60px,
                var(--primary) 60px, var(--primary) 80px
            );
            margin-top: 60px;
            position: relative;
            z-index: 1;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            grid-column: 1/-1;
            padding: 80px 20px;
            color: var(--text-light);
        }

        .empty-state .empty-icon {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
        }

        .empty-state p {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .container { grid-template-columns: 1fr; }
            aside { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
            .sidebar-card:hover { transform: translateY(-3px); box-shadow: 0 6px 0 var(--border-color); }
        }

        @media (max-width: 768px) {
            .navbar-main { flex-wrap: wrap; }
            .search-bar { order: 3; width: 100%; margin: 12px 0 0 0; }
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
            .theme-toggle-nav { display: none; }
        }
    </style>
</head>
<body data-theme="light">

    <div class="bg-pattern"></div>
    <div class="border-strip-top"></div>

    <nav class="navbar">
        <div class="navbar-top">
            <a href="{% url 'purchase_history' %}">📋 Kasaysayan ng Purchases</a>
            {% if user.is_authenticated %}
                <span class="user-chip">👤 {{ user.username }}</span>
                <a href="{% url 'logout' %}">Mag-Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login / Sign Up</a>
            {% endif %}
            <button class="theme-toggle-nav" onclick="toggleTheme()">🌙 Mode</button>
        </div>
        <div class="navbar-main">
            <div class="logo-wrap" onclick="window.location.reload()">
                <div class="logo">Tindahan</div>
                <div class="logo-tagline">Ang iyong merkado</div>
            </div>

            <div class="search-bar">
                <input type="text" id="search-input" class="search-input" placeholder="Hanapin ang produkto..." onkeyup="handleSearch(event)">
                <button class="search-btn" onclick="performSearch()">🔍</button>
            </div>

            <div class="navbar-actions">
                <a href="{% url 'cart' %}" class="cart-link">
                    🛒
                    <span id="cart-count" class="cart-badge">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <aside>
            <div class="sidebar-card">
                <h4><span class="h4-accent"></span>Mga Kategorya</h4>
                <div id="category-list">Naglo-load...</div>
            </div>
            <div class="sidebar-card">
                <h4><span class="h4-accent"></span>Mga Tindahan</h4>
                <div id="store-list">Naglo-load...</div>
            </div>
        </aside>

        <main>
            <div id="product-grid" class="product-grid"></div>
        </main>
    </div>

    <div class="footer-strip"></div>

    <div id="toast" class="toast">
        <span id="toast-icon">✅</span>
        <span id="toast-message">Tagumpay!</span>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/api/";
        let allProducts = [];

        function toggleTheme() {
            const body = document.body;
            const btns = document.querySelectorAll('.theme-toggle-nav');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                btns.forEach(b => b.textContent = '🌙 Mode');
            } else {
                body.setAttribute('data-theme', 'dark');
                btns.forEach(b => b.textContent = '☀️ Mode');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            document.getElementById('toast-icon').textContent = type === 'success' ? '✅' : '❌';
            toast.className = `toast ${type}`;
            toast.style.display = 'flex';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        async function updateCartBadge() {
            try {
                const res = await fetch(`${API_URL}cartitems/`);
                const items = await res.json();
                document.getElementById('cart-count').innerText = items.length;
            } catch (err) {
                console.error("Badge update error:", err);
            }
        }

        async function initShop(filterQuery = "") {
            try {
                updateCartBadge();

                const [catRes, storeRes, prodRes] = await Promise.all([
                    fetch(`${API_URL}categories/`),
                    fetch(`${API_URL}stores/`),
                    fetch(filterQuery ? `${API_URL}products/?${filterQuery}` : `${API_URL}products/`)
                ]);

                const categories = await catRes.json();
                document.getElementById('category-list').innerHTML = categories.map(c =>
                    `<div class="list-item" onclick="initShop('category=${c.id}')"><span>${c.category_name}</span><span>→</span></div>`
                ).join('');

                const stores = await storeRes.json();
                document.getElementById('store-list').innerHTML = stores.map(s =>
                    `<div class="list-item" onclick="initShop('store=${s.id}')"><span>${s.store_name}</span><span>⭐ ${s.rating}</span></div>`
                ).join('');

                const products = await prodRes.json();
                allProducts = products;
                displayProducts(products);

            } catch (err) {
                console.error("Init error:", err);
            }
        }

        function displayProducts(products) {
            const grid = document.getElementById('product-grid');
            if (products.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <span class="empty-icon">🔍</span>
                        <p>Walang produktong nahanap</p>
                    </div>`;
                return;
            }
            grid.innerHTML = products.map(p => {
                const isSoldOut = p.stock_quantity <= 0;
                return `
                    <div class="card">
                        ${isSoldOut ? '<div class="sold-out-overlay">Ubos na</div>' : ''}
                        <div class="card-image"><img src="${p.image || ''}" onerror="this.parentNode.innerHTML='📦'"></div>
                        <div class="card-body">
                            <div class="product-name">${p.name}</div>
                            <div class="product-description">${p.description}</div>
                            <div class="price-row">
                                <div class="price">₱${parseFloat(p.price).toLocaleString()}</div>
                                <div class="stock-badge ${isSoldOut ? 'out' : ''}">${isSoldOut ? 'Ubos' : p.stock_quantity + ' natitira'}</div>
                            </div>
                            <div class="btn-group">
                                <button class="cart-btn" onclick="addToCart(${p.id})" ${isSoldOut ? 'disabled' : ''}>🛒 Cart</button>
                                <button class="order-btn" onclick="buyNow(${p.id})" ${isSoldOut ? 'disabled' : ''}>Bilhin</button>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        async function addToCart(productId) {
            try {
                const res = await fetch(`${API_URL}cartitems/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ cart: 1, product: productId, quantity: 1 })
                });
                if (res.ok) {
                    showToast("Naidagdag sa cart!");
                    updateCartBadge();
                } else {
                    showToast("Hindi naidagdag", "error");
                }
            } catch (err) { console.error(err); }
        }

        function buyNow(productId) {
            window.location.href = `/checkout/?product_id=${productId}&quantity=1`;
        }

        function handleSearch(e) { if (e.key === 'Enter') performSearch(); }

        function performSearch() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
            displayProducts(filtered);
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        initShop();
    </script>
</body>
</html>
